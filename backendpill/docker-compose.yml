version: '3.8'

services:
  postgres:
    image: postgres:15.4-alpine
    container_name: cidju-postgres-1
    ports:
      - "5432:5432"  # ¡Aquí está la magia que faltaba!
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=backendpill_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: