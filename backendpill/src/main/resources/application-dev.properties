# Mejor manejo de errores en desarrollo para ver qué pasa
server.error.include-message=always
server.error.include-binding-errors=always

# --- CONEXIÓN A BASE DE DATOS DOCKER ---
# Nombre de la DB ajustado a 'backendpill_db' (según tu docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/backendpill_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Pool de conexiones (HikariCP) optimizado para dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# JPA: 'update' crea las tablas si no existen, pero no borra datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs detallados de SQL para debuggear
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE