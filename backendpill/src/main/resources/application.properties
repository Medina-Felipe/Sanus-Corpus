spring.application.name=backendpill
# Perfil activo por defecto: Desarrollo
spring.profiles.active=dev

# Configuración del Servidor
server.port=${PORT:8080}
server.shutdown=graceful
server.http2.enabled=true
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/javascript

# Jackson (JSON)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# JPA Base
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator (Monitoreo)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true

# Subida de Archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Seguridad JWT
app.jwt.secret=${APP_JWT_SECRET:b2lJQmV0dGVyUGxhY2VBYkFzZUZpc2EwMjQxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==}
# 3600000 ms = 1 hora
app.jwt.expiration-ms=${APP_JWT_EXP_MS:3600000}

# Logging Global
logging.level.root=INFO
logging.level.org.springframework.web=INFO