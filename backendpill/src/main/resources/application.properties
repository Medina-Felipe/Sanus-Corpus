
spring.application.name=backendpill
spring.profiles.active=dev


server.port=${PORT:8080}
server.shutdown=graceful
server.http2.enabled=true

server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/javascript

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ... (todas tus otras propiedades)

# ... (todas tus otras propiedades)

# Configuración de JWT
app.jwt.secret=${APP_JWT_SECRET:b2lJQmV0dGVyUGxhY2VBYkFzZUZpc2EwMjQxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==}

# CORRECCIÓN: Tu JwtService busca 'app.jwt.expiration-ms' (en milisegundos)
# 3600000 = 1 hora (3600 segundos * 1000)
app.jwt.expiration-ms=${APP_JWT_EXP_MS:3600000}
logging.level.root=INFO
logging.level.org.springframework.web=INFO